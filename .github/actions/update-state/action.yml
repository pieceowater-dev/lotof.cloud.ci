name: "Update lotof.cloud.state"
description: "Updates the Docker image version in lotof.cloud.state"
inputs:
  repo-name:
    description: "Repository name"
    required: true
  commit-sha:
    description: "Commit SHA"
    required: true
  branch:
    description: "Branch"
    required: true
  ssh-key:
    description: "SSH private key"
    required: true

runs:
  using: "composite"
  steps:
    - name: Update image version in the state repository
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
        REPO_NAME: ${{ inputs.repo-name }}
        COMMIT_SHA: ${{ inputs.commit-sha }}
        STATE_BRANCH: ${{ inputs.branch }}
        OWNER: ${{ github.repository_owner }}
      run: |
        set -euo pipefail
        # Everything lives in a throwaway directory. On a self-hosted runner ~
        # is a real account's home: the deploy key, known_hosts and the git
        # identity must never be written there.
        WORK=$(mktemp -d)
        trap 'rm -rf "$WORK"' EXIT
        install -m 600 /dev/null "$WORK/id_ed25519"
        printf '%s\n' "$SSH_KEY" > "$WORK/id_ed25519"
        export GIT_SSH_COMMAND="ssh -i $WORK/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$WORK/known_hosts -o StrictHostKeyChecking=accept-new"
        export GIT_AUTHOR_NAME="GitHub Actions" GIT_AUTHOR_EMAIL="actions@github.com"
        export GIT_COMMITTER_NAME="GitHub Actions" GIT_COMMITTER_EMAIL="actions@github.com"

        git clone -q "git@github.com:pieceowater-dev/lotof.cloud.state.${STATE_BRANCH}.git" "$WORK/state"
        cd "$WORK/state"
        SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
        sed -i "s|image:.*|image: ghcr.io/${OWNER}/${REPO_NAME}:${SHORT_SHA}|" "$REPO_NAME/patch.yaml"
        if git diff --quiet; then
          echo "$REPO_NAME is already at $SHORT_SHA"
          exit 0
        fi
        git commit -q -am "Update image for ${REPO_NAME} to ${SHORT_SHA}"

        # Several services deploy at once; a non-fast-forward push used to fail
        # the job and silently drop that deploy. Rebase and retry instead.
        for attempt in 1 2 3 4 5; do
          if git push -q; then
            echo "state updated: $REPO_NAME -> $SHORT_SHA"
            exit 0
          fi
          sleep $((attempt * 2))
          git pull -q --rebase
        done
        echo "failed to push the state update after 5 attempts" >&2
        exit 1
